name: Build index

# Scryfall refreshes its bulk files around 10:00 UTC. GitHub pauses scheduled
# workflows after 60 days without repository activity; re-enable this one in the
# Actions tab if that happens. The site keeps working on its last index.
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # To start the deploy below.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run index:build
      - uses: actions/upload-artifact@v7
        with:
          name: index
          path: data
          retention-days: 30
          if-no-files-found: error
      # Pushes made with GITHUB_TOKEN don't start workflows, but an explicit dispatch does.
      - run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
